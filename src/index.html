<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grocery List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           var(--hub-bg, #f9fafb);
      --card:         var(--hub-surface, #ffffff);
      --border:       var(--hub-border, #e5e7eb);
      --border-mid:   var(--hub-border, #d1d5db);
      --text:         var(--hub-text, #000000);
      --muted:        var(--hub-text-muted, #6b7280);
      --accent:       var(--hub-primary, #111827);
      --accent-hover: var(--hub-primary-hover, #374151);
      --accent-light: #f3f4f6;
      --radius:       var(--hub-radius, 0.5rem);
      --shadow:       0 1px 3px rgba(0,0,0,.07);
      --green:  #059669; --green-light: #d1fae5;
      --red:    #dc2626; --red-light:   #fee2e2;
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      font-size: var(--hub-font-size, 15px);
      line-height: 1.5;
    }

    .app { max-width: 560px; margin: 0 auto; padding: 16px; }

    /* ── Add bar ── */
    .add-bar {
      display: flex; gap: 8px; margin-bottom: 16px;
    }
    .add-input {
      flex: 1; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 13px; font-size: 0.92rem; outline: none;
      transition: border-color .15s; font-family: inherit; background: var(--card);
    }
    .add-input:focus { border-color: var(--accent); }
    .add-btn {
      padding: 9px 18px; background: var(--accent); color: var(--hub-primary-fg, #fff);
      border: none; border-radius: 8px; font-size: 0.875rem; font-weight: 600;
      cursor: pointer; transition: background .15s; white-space: nowrap;
    }
    .add-btn:hover { background: var(--accent-hover); }
    .add-btn:disabled { opacity: .45; cursor: default; }

    /* ── Error ── */
    .error-msg {
      background: var(--red-light); color: var(--red); border-radius: 8px;
      padding: 8px 13px; font-size: 0.85rem; margin-bottom: 12px;
    }

    /* ── Section labels ── */
    .section-label {
      font-size: 0.7rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .07em;
      margin: 14px 0 6px; padding: 0 2px;
    }

    /* ── Item list ── */
    .item-list {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden;
    }

    .item-row {
      display: flex; align-items: center; gap: 12px;
      padding: 11px 14px; border-bottom: 1px solid var(--border);
      transition: background .1s;
    }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: #fafafa; }
    .item-row.checked { background: #fafafa; }

    /* Checkbox — visible only to adults */
    .check-btn {
      width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid var(--border-mid); background: var(--card);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 11px; color: transparent; transition: all .15s;
    }
    .check-btn:hover { border-color: var(--green); background: var(--green-light); }
    .item-row.checked .check-btn {
      background: var(--green); border-color: var(--green); color: white;
    }
    .check-btn.readonly {
      cursor: default; opacity: .35;
    }
    .check-btn.readonly:hover { border-color: var(--border-mid); background: var(--card); }

    .item-name {
      flex: 1; font-size: 0.92rem;
    }
    .item-row.checked .item-name {
      color: var(--muted); text-decoration: line-through;
    }

    .item-meta {
      font-size: 0.75rem; color: var(--muted); white-space: nowrap;
    }
    .item-row.checked .item-meta { opacity: .6; }

    /* ── Footer actions ── */
    .list-footer {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 10px; flex-wrap: wrap; gap: 8px;
    }
    .count-label { font-size: 0.8rem; color: var(--muted); }
    .clear-btn {
      font-size: 0.8rem; font-weight: 600; color: var(--red); background: none;
      border: 1.5px solid var(--border-mid); border-radius: 6px; padding: 4px 12px;
      cursor: pointer; transition: all .15s;
    }
    .clear-btn:hover { background: var(--red-light); border-color: var(--red); }

    .avatar {
      width: 44px; height: 44px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 800; color: white;
    }

    /* ── Empty ── */
    .empty { text-align: center; padding: 32px 16px; color: var(--muted); font-size: 0.9rem; }
    .loading { text-align: center; padding: 48px; color: var(--muted); }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
<base href="/run/grocery/">
</head>
<body>
<div class="app">
  <div id="root"><div class="loading">Loading…</div></div>
</div>

<script type="module">
import { memberColor, initial, esc, isAdult, hubConfirm, searchMatch } from "/hub-sdk.js";
import { normalizeItem, isDuplicate, reviveTarget, sortItems, searchableFields } from "./logic.js";

const CONTEXT    = window.__CONTEXT_URL ?? "";
const DB         = window.__DB_URL      ?? "";
const STORE      = window.__STORE_URL   ?? "";
const APP_ID     = window.__APP_ID      ?? "grocery";
const HUB_MEMBER = window.__CURRENT_MEMBER ?? null;

const EVENTS = window.__EVENTS_URL ?? "";

async function publishEvent(type, subjectId, payload = {}) {
  if (!EVENTS) return;
  try {
    await fetch(EVENTS, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ type, subject_id: subjectId, payload }),
    });
  } catch {
    // Best-effort: the row is already written, so a failed publish is not fatal.
  }
}


let members       = [];
let currentMember = null;
let items         = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)

// ── DB ────────────────────────────────────────────────────────────────────────
async function dbq(sql, params = []) {
  if (!DB) return { rows: [] };
  const res = await fetch(DB, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ sql, params }),
  });
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

// ── Setup ─────────────────────────────────────────────────────────────────────
async function setup() {
  // Schema is managed by hub migrations
}

// ── Data ──────────────────────────────────────────────────────────────────────
async function loadMembers() {
  if (!CONTEXT) {
    members = [
      { id: "demo-1", name: "Alex",  role: "adult" },
      { id: "demo-2", name: "Jordan", role: "adult" },
      { id: "demo-3", name: "Casey", role: "child" },
      { id: "demo-4", name: "Riley", role: "child" },
    ];
    return;
  }
  try {
    const res = await fetch(`${CONTEXT}?keys=family.members`);
    members = ((await res.json())["family.members"]) ?? [];
  } catch { members = []; }
}

async function loadItems() {
  const { rows } = await dbq(`SELECT * FROM app_grocery__items ORDER BY checked ASC, name ASC`);
  items = rows.map(r => ({ ...r, checked: !!r.checked }));
}

// ── Pending inbox (cross-app writes from other apps) ─────────────────────────
async function processPendingInbox() {
  if (!STORE) return;
  try {
    const res = await fetch(`${STORE}?key=pending_items`);
    if (!res.ok) return;
    const { value } = await res.json();
    if (!value) return;
    const pending = JSON.parse(value).items ?? [];
    if (!pending.length) return;

    const now = new Date().toISOString();
    const newItems = [];
    const reviveIds = [];
    for (const item of pending) {
      const name = typeof item.name === "string" ? item.name.trim() : "";
      if (!name) continue;
      const addedBy = typeof item.addedBy === "string" ? item.addedBy.trim() : "another app";
      const normalized = normalizeItem(name);
      const revive = reviveTarget(items, name);
      if (revive) {
        // Revive a checked-off duplicate rather than dropping the request.
        revive.checked = false;
        revive.checked_by_name = null;
        reviveIds.push(revive.id);
        continue;
      }
      if (isDuplicate(items, name)) continue; // already active
      newItems.push({
        id: crypto.randomUUID(), name, name_normalized: normalized,
        added_by_id: "cross-app", added_by_name: addedBy, checked: false, created_at: now,
      });
    }
    if (!newItems.length && !reviveIds.length) {
      fetch(`${STORE}?key=pending_items`, { method: "DELETE" }).catch(() => {});
      return;
    }

    // Optimistic update: show new items immediately
    items = [...items, ...newItems];
    render();

    // Persist in the background
    await Promise.all([
      ...newItems.map(it => dbq(
        `INSERT INTO app_grocery__items (id, name, name_normalized, added_by_id, added_by_name, checked, created_at)
         VALUES (?, ?, ?, ?, ?, 0, ?)
         ON CONFLICT DO NOTHING`,
        [it.id, it.name, it.name_normalized, it.added_by_id, it.added_by_name, it.created_at]
      ).catch(() => {})),
      ...reviveIds.map(id => dbq(
        `UPDATE app_grocery__items SET checked = 0, checked_by_name = NULL, created_at = ? WHERE id = ?`,
        [now, id]
      ).catch(() => {})),
    ]);

    // Clear the inbox now that items are processed
    fetch(`${STORE}?key=pending_items`, { method: "DELETE" }).catch(() => {});
  } catch { /* non-fatal — don't block app load */ }
}

// ── Actions ───────────────────────────────────────────────────────────────────
async function addItem(rawName) {
  const name       = rawName.trim();
  const normalized = normalizeItem(name);
  if (!name) return;

  // Re-adding a checked-off item revives it (rather than hitting the
  // UNIQUE(name_normalized) constraint), matching the kiosk quick-add lane.
  const revive = reviveTarget(items, name);
  if (revive) {
    clearError();
    const prev = { checked: revive.checked, checked_by_name: revive.checked_by_name };
    revive.checked = false;
    revive.checked_by_name = null;
    render();
    try {
      await dbq(
        `UPDATE app_grocery__items SET checked = 0, checked_by_name = NULL, created_at = ? WHERE id = ?`,
        [new Date().toISOString(), revive.id]
      );
      await loadItems();
      render();
    } catch {
      Object.assign(revive, prev);
      showError(`Could not add "${name}" — try again.`);
      render();
    }
    return;
  }

  // Client-side dedup check for a friendly error (only active items block)
  if (isDuplicate(items, name)) {
    showError(`"${name}" is already on the list.`);
    return;
  }

  clearError();

  // Optimistic insert: show the item immediately, reconcile with the server after.
  const tempId = `temp-${crypto.randomUUID()}`;
  items = [...items, {
    id: tempId, name, name_normalized: normalized,
    added_by_id: currentMember.id, added_by_name: currentMember.name,
    checked: false, checked_by_name: null, created_at: new Date().toISOString(),
  }];
  render();

  try {
    await dbq(
      `INSERT INTO app_grocery__items (id, name, name_normalized, added_by_id, added_by_name, checked, created_at)
       VALUES (?, ?, ?, ?, ?, 0, ?)`,
      [crypto.randomUUID(), name, normalized,
       currentMember.id, currentMember.name, new Date().toISOString()]
    );
    // Published only from the member-typed add, never from processPendingInbox:
    // draining the inbox would re-emit items another app just sent here, and a
    // grocery -> pantry -> grocery rule pair would loop.
    await publishEvent("grocery.item_added", normalized, {
      name,
      added_by_id: currentMember.id,
    });
    await loadItems();
    render();
  } catch (e) {
    // Roll back the optimistic item on failure.
    items = items.filter(i => i.id !== tempId);
    // UNIQUE constraint → already exists (race condition)
    if (e.message?.includes("UNIQUE") || e.message?.includes("unique")) {
      showError(`"${name}" is already on the list.`);
    } else {
      showError("Could not add item — try again.");
    }
    render();
  }
}

async function toggleCheck(itemId) {
  if (!currentMember) return;
  const item = items.find(i => i.id === itemId);
  if (!item) return;
  const wasChecked = item.checked;
  const next = wasChecked ? 0 : 1;

  // Optimistic update: reflect change immediately before DB write
  item.checked = !!next;
  item.checked_by_name = next ? currentMember.name : null;
  render();

  try {
    await dbq(
      `UPDATE app_grocery__items SET checked = ?, checked_by_name = ? WHERE id = ?`,
      [next, next ? currentMember.name : null, itemId]
    );
  } catch {
    // Revert on failure
    item.checked = wasChecked;
    item.checked_by_name = wasChecked ? item.checked_by_name : null;
    render();
  }
}

async function clearChecked() {
  if (!currentMember) return;
  if (!await hubConfirm({ message: "Remove all checked items?", confirmLabel: "Clear checked" })) return;

  // Optimistic: remove checked items immediately, restore on failure.
  const removed = items.filter(i => i.checked);
  items = items.filter(i => !i.checked);
  render();

  // Persist in the background — no re-sync needed; optimistic state is authoritative.
  // (Re-fetching from DB after DELETE races with in-flight toggleCheck writes.)
  (async () => {
    try {
      await dbq(`DELETE FROM app_grocery__items WHERE checked = 1`);
    } catch {
      items = [...items, ...removed];
      showError("Could not clear checked items — try again.");
      render();
    }
  })();
}

// ── Rendering ─────────────────────────────────────────────────────────────────
function renderList() {
  const sorted   = searchQ
    ? sortItems(items).filter(i => searchMatch(searchQ, searchableFields(i)))
    : sortItems(items);
  const unchecked = sorted.filter(i => !i.checked);
  const checked   = sorted.filter(i => i.checked);
  // Grocery is a fully collaborative shared list: any household member may add,
  // check off, and clear items (the `items` table has no row policy). We only
  // require a resolved member to attribute the action to.
  const canWrite = !!currentMember;

  const addBar = canWrite ? `
    <div class="add-bar">
      <input id="add-input" class="add-input" type="text"
        placeholder="Add an item…"
        onkeydown="if(event.key==='Enter')doAdd()"
        autocomplete="off" autocapitalize="words" />
      <button class="add-btn" onclick="doAdd()">Add</button>
    </div>
    <div id="error-msg" class="error-msg" style="display:none"></div>` : `
    <div id="error-msg" class="error-msg" style="display:none"></div>`;

  function itemRow(item) {
    const btn = canWrite
      ? `<button class="check-btn" data-id="${esc(item.id)}" title="${item.checked ? "Uncheck" : "Check off"}">✓</button>`
      : `<div class="check-btn readonly" title="Sign in to check items">✓</div>`;
    const meta = item.checked && item.checked_by_name
      ? `<span class="item-meta">by ${esc(item.checked_by_name)}</span>`
      : `<span class="item-meta">${esc(item.added_by_name)}</span>`;
    return `
      <div class="item-row ${item.checked ? "checked" : ""}">
        ${btn}
        <span class="item-name">${esc(item.name)}</span>
        ${meta}
      </div>`;
  }

  const searchRow = items.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search the list…" aria-label="Search the list" value="${esc(searchQ)}" /></div>` : "";

  let listHtml = "";
  if (items.length === 0) {
    listHtml = `<div class="empty">Nothing on the list yet — add the first item above.</div>`;
  } else if (sorted.length === 0) {
    listHtml = `<div class="empty">Nothing matches "${esc(searchQ)}".</div>`;
  } else {
    if (unchecked.length > 0) {
      listHtml += `<div class="item-list">${unchecked.map(itemRow).join("")}</div>`;
    }
    if (checked.length > 0) {
      listHtml += `
        <div class="section-label">In the cart (${checked.length})</div>
        <div class="item-list">${checked.map(itemRow).join("")}</div>`;
    }
  }

  const footer = `
    <div class="list-footer">
      <span class="count-label">
        ${unchecked.length} item${unchecked.length !== 1 ? "s" : ""} to get
      </span>
      ${canWrite && checked.length > 0
        ? `<button class="clear-btn" onclick="doClear()">Clear checked (${checked.length})</button>`
        : ""}
    </div>`;

  document.getElementById("root").innerHTML = addBar + searchRow + listHtml + footer;
  // Typing in the search box must not steal focus back to the add field.
  const searchEl = document.getElementById("search");
  if (searchQ && searchEl) {
    searchEl.focus();
    searchEl.setSelectionRange(searchQ.length, searchQ.length);
  } else {
    document.getElementById("add-input")?.focus();
  }
}

function render() {
  renderList();
}

document.addEventListener("input", (e) => {
  if (e.target.id !== "search") return;
  searchQ = e.target.value;
  renderList();
});

// ── Error helpers ─────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById("error-msg");
  if (!el) return;
  el.textContent = msg;
  el.style.display = "block";
}
function clearError() {
  const el = document.getElementById("error-msg");
  if (el) el.style.display = "none";
}

// ── Window globals ────────────────────────────────────────────────────────────
window.doAdd = async function() {
  const input = document.getElementById("add-input");
  if (!input?.value.trim()) return;
  const val = input.value;
  input.value = "";
  const btn = document.querySelector('.add-btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  await addItem(val);
  if (btn) { btn.disabled = false; btn.textContent = 'Add'; }
};
window.doClear  = () => clearChecked();

// Delegated check-off handler. Item ids are attacker-controllable — the `items`
// table has no row policy, so ANY member can INSERT a row with a crafted id via
// raw /api/db. Keeping the id in a data-* attribute + delegation (never an inline
// onclick JS string) prevents stored XSS. #root persists across re-renders.
document.getElementById("root").addEventListener("click", (e) => {
  const b = e.target.closest(".check-btn:not(.readonly)");
  if (b?.dataset.id) toggleCheck(b.dataset.id);
});

// ── Init ──────────────────────────────────────────────────────────────────────
(async () => {
  await loadMembers();
  await setup();
  await loadItems();
  if (HUB_MEMBER) {
    currentMember = members.find(m => m.id === HUB_MEMBER.id) ?? {
      id: HUB_MEMBER.id, name: HUB_MEMBER.name, role: HUB_MEMBER.role,
    };
  }
  render();
  // Process cross-app inbox in background; re-render when done
  processPendingInbox().then(async () => {
    await loadItems();
    render();
  }).catch(() => {});
})();
</script>
</body>
</html>
